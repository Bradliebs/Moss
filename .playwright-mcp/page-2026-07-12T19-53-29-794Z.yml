            - paragraph [ref=e477]: This stylish 3-in-1 air conditioner is one impressive model. Its compact, portable design packs enough power to cool rooms up to 38 SQM without taking up too much floor space. Plus, there's the option of a fan mode which is great for when you're on your own and only need a small area of your room cooling quickly. As well as cooling your room, the air conditioner doubles as a powerful dehumidifier to remove any excess moisture that can lead to the growth of mould and damp - ideal for when you need to dry your laundry indoors. And, thanks to the dehumidifiers advanced self-evaporative system, you won't have to empty the water tank half as much because most of what is collected is reused to cool the condenser coils.
            - paragraph [ref=e478]: The air conditioner is ready to work straight out of the box and doesn't require any permanent installation, so you can have it up and going in no time at all. It stands on a set of castor wheels and features integrated side handles, meaning you'll be able to move it from room to room with ease. The digital control panel and LCD display makes for quick and easy selection of the functions, fan speeds and temperature settings. There's also a timer function that can be set to automatically switch on/off at a convenient time - so you can have it run while you're sleeping, at work, or at an off peak electricity period.
