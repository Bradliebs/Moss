          - list [ref=f13e274]:
            - listitem [ref=f13e275]: "Year-Round Comfort: Ideal for spaces up to 26 sqm with a heat pump for winter warming."
            - listitem [ref=f13e276]: "Smart Wi-Fi & Voice: Fully compatible with the Tuya app, Alexa, and Google Home. Control your climate from anywhere and schedule cooling to save energy."
