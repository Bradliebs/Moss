                    - text: Powerful cooling - 10,000 BTU/h cooling capacity with 16°C-32°C adjustable thermostat.
                  - listitem [ref=f13e307]:
                    - strong [ref=f13e308]: "Energy-efficient:"
                    - text: A+ rated. Includes fishtail adapter for venting out of a window.
                  - listitem [ref=f13e309]:
                    - strong [ref=f13e310]: Smart cool function
                    - text: "- Automatically adjusts the fan speed to match the cooling needs."
                  - listitem [ref=f13e311]:
                    - strong [ref=f13e312]: "Dehumidifier:"
                    - text: Removes up to 24L of moisture from the air per day. The advanced self-evaporative system uses most of the moisture collected to cool the condenser coils, so the water tank doesn't require emptying as often.
                  - listitem [ref=f13e313]:
                    - strong [ref=f13e314]: "Fan/Air Purifier:"
                    - text: It features an advanced 5-speed fan for added flexibility - Keep cool and enhance the air quality in your room without the need for venting. Dust, allergens and unpleasant odours are filtered from the air, making it ideal for individuals with allergies or asthma.
                  - listitem [ref=f13e315]:
                    - strong [ref=f13e316]: "Smart device compatible:"
                    - text: Control remotely or by voice with Amazon Echo, Alexa or Google Home Assistant.
                  - listitem [ref=f13e317]:
                    - strong [ref=f13e318]: "24-hour timer:"
                    - text: Manual 24 hrs start/stop timer or advanced App control. Helpful when pre-cooling or heating a room.
                  - listitem [ref=f13e319]:
                    - strong [ref=f13e320]: "Compact and portable:"
                    - text: Built-in carry handles and castors for easy movement.
                  - listitem [ref=f13e321]:
                    - strong [ref=f13e322]: "Energy efficient:"
                    - text: A+ rated energy efficiency so it helps keep your bills lower than less efficient units.
                  - listitem [ref=f13e323]:
                    - strong [ref=f13e324]: "Sleep mode:"
                    - text: Sleep mode reduces the fan noise and disables the LED lights to aid a good night's sleep.
                  - listitem [ref=f13e325]:
                    - strong [ref=f13e326]: "Window kit and remote:"
