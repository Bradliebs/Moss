                - paragraph [ref=f13e302]: This advanced 4‑in‑1 portable air conditioner delivers powerful cooling for rooms up to 28 sqm and includes efficient heat‑pump heating for use throughout the year. Switch to fan‑only mode and choose from five airflow speeds, or activate the built‑in dehumidifier to speed up laundry drying and tackle excess moisture, damp, or mould.With full smart control, you can adjust every function from anywhere using your phone or a voice assistant, giving you complete control at home or on the go.t
