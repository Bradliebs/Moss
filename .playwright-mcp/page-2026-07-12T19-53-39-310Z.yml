            - listitem [ref=f13e281]: "Powerful Dehumidifier: Dedicated mode extracts up to 24L/day with no need for venting."
            - listitem [ref=f13e282]: "Flexible Installation: Includes UK's longest 2.0m exhaust hose, offering significantly more placement freedom than standard units. See recommended accessories for compatible window kits."
