name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:deterministic
      - run: npm run build
      - name: Validate representative corpus and graders
        shell: pwsh
        run: |
          $env:MOSS_EVAL_CORPUS = "representative"
          $env:MOSS_EVAL_EXPERIMENT = "phase5-runtime"
          npm run eval:health
